services:
  - type: web
    name: crack-the-account
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crack-the-account-db
          property: connectionString
      - key: ADMIN_KEY
        generateValue: true

databases:
  - name: crack-the-account-db
    plan: free
